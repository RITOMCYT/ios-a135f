
      - name: Install AOSP boot image tools
        run: |
          git clone --depth 1 \
            https://android.googlesource.com/platform/system/tools/mkbootimg \
            /tmp/aosp-mkbootimg

          mkdir -p "$RUNNER_TEMP/bin"

          cat > "$RUNNER_TEMP/bin/mkbootimg" <<'EOF'
          #!/bin/bash
          exec python3 /tmp/aosp-mkbootimg/mkbootimg.py "$@"
          EOF

          cat > "$RUNNER_TEMP/bin/unpack_bootimg.py" <<'EOF'
          #!/bin/bash
          exec python3 /tmp/aosp-mkbootimg/unpack_bootimg.py "$@"
          EOF

          chmod +x "$RUNNER_TEMP/bin/"*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          mkbootimg --help
          unpack_bootimg.py --help
