
name: Build A135F Boot Image

on:
  workflow_dispatch:
    inputs:
      xnu_run_id:
        description: "Run ID of the successful XNU workflow"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download XNU kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-development-a135f
          path: artifacts/kernel
          run-id: ${{ inputs.xnu_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc \
            make \
            cpio \
            gzip \
            python3 \
            python3-pip \
            python3-venv \
            file

      - name: Install mkbootimg
        run: |
          python3 -m venv .venv
          .venv/bin/pip install mkbootimg
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Prepare XNU kernel
        run: |
          mkdir -p xnu/out shim/out
          KERNEL=$(find artifacts/kernel -type f \
            -name 'kernel.development.a135f' | head -n 1)

          test -n "$KERNEL"
          cp "$KERNEL" xnu/out/kernel.development.a135f
          file xnu/out/kernel.development.a135f

      - name: Generate ADT
        run: |
          python3 tools/mkadt.py shim/out/a135f.adt

      - name: Generate XNU payload
        run: |
          python3 tools/mkpayload.py \
            xnu/out/kernel.development.a135f \
            shim/out/a135f.adt \
            shim/out/payload.bin \
            --cmdline 'debug=0xc serial=3 cpus=8 keepsyms=1 -noprogress rd=mmcroot0 mmcrw=1 rootrw=1 launchd_unsecure_cache=1 wdt=-1 a135f_fb_noconsole=1 a135f_fb_hz=30'

      - name: Build shim and Android boot image
        run: |
          chmod +x shim/build.sh
          cd shim
          ./build.sh out/payload.bin

      - name: Verify output
        run: |
          ls -lh shim/out/
          test -s shim/out/Image
          test -s shim/out/ramdisk.bin
          test -s shim/out/boot.img
          test -s shim/out/AP_a135f.tar.md5

      - name: Upload boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A135F-XNU-BOOT
          path: |
            shim/out/boot.img
            shim/out/a135f-boot.img
            shim/out/AP_a135f.tar.md5
            shim/out/Image
            shim/out/ramdisk.bin
            shim/out/payload.bin
            shim/out/a135f.adt
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
